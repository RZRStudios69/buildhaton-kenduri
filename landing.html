<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kenduri RSVP — Aina &amp; Harith</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Karla:wght@400;600;700&family=Pinyon+Script&display=swap" rel="stylesheet" />
<script>
// Apply the saved theme before first paint so there is no colour flash.
(function () {
  try {
    var savedTheme = window.localStorage.getItem('kenduri-theme');
    if (savedTheme === 'taman' || savedTheme === 'senja') {
      document.documentElement.classList.add('theme-' + savedTheme);
    }
  } catch (themeLoadError) {
    // Storage unavailable — the default theme applies.
  }
})();
</script>
<style>
  :root {
    --ink: #3d3630;
    --ink-soft: #6f655c;
    --paper: #faf7f2;
    --card: #ffffff;
    --line: #e8e1d7;
    --accent: #9a8467;
    --accent-soft: #f1ebe2;
    --outer-bg: #3d3630;
    --frame-line: #57493f;
    --flower: #ffffff;
    --leaf: #7d9070;
    --stem: #8a7a5c;
    --button-bg: #3d3630;
    --button-text: #ffffff;
    --button-hover: #57493f;
    --serif: "Cormorant Garamond", "Georgia", "Times New Roman", serif;
    --sans: "Karla", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --script: "Pinyon Script", "Cormorant Garamond", cursive;
  }

  /* ---------- Theme: Taman (botanical sage) ---------- */

  :root.theme-taman {
    --ink: #26302a;
    --ink-soft: #55645a;
    --paper: #e7efe4;
    --card: #f6f9f4;
    --line: #c8d6c4;
    --accent: #3d6349;
    --accent-soft: #d9e7d9;
    --outer-bg: #2a342c;
    --frame-line: #465644;
    --flower: #f4f7ef;
    --leaf: #5f7f5e;
    --stem: #6d7f62;
    --button-bg: #3d6349;
    --button-hover: #32523c;
  }

  /* ---------- Theme: Senja (dark evening, antique gold) ---------- */

  :root.theme-senja {
    --ink: #ece4d6;
    --ink-soft: #b3a690;
    --paper: #241f1a;
    --card: #2d2620;
    --line: #40372d;
    --accent: #c9a86a;
    --accent-soft: #3a3126;
    --outer-bg: #191510;
    --frame-line: #4a3e2f;
    --flower: #e8dcc4;
    --leaf: #8a7a52;
    --stem: #a08b5f;
    --button-bg: #c9a86a;
    --button-text: #262019;
    --button-hover: #b8965c;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--sans);
    color: var(--ink);
    background: var(--outer-bg);
    line-height: 1.55;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 16px;
  }

  .frame {
    position: relative;
    width: 100%;
    max-width: 960px;
    background: var(--paper);
    border: 1px solid var(--frame-line);
    padding: 48px 40px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 36px;
    align-items: center;
    overflow: hidden;
  }

  @media (max-width: 719px) {
    body { padding: 16px 12px; }
    .frame { grid-template-columns: 1fr; padding: 36px 24px; gap: 28px; }
    .couple-illustration { max-width: 260px; margin: 0 auto; }
  }

  /* ---------- Illustration ---------- */

  .couple-illustration { width: 100%; display: block; }
  .couple-illustration svg { width: 100%; height: auto; display: block; }

  /* ---------- Text block ---------- */

  .landing-text { text-align: center; padding: 12px 8px; }

  .landing-names {
    font-family: var(--script);
    font-size: 64px;
    font-weight: 400;
    line-height: 1.1;
    margin: 0 0 6px;
    color: var(--ink);
  }

  @media (max-width: 719px) {
    .landing-names { font-size: 48px; }
  }

  .landing-kicker {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 10px;
  }

  .landing-date {
    font-family: var(--serif);
    font-size: 22px;
    color: var(--ink-soft);
    margin: 0 0 16px;
  }

  .landing-blurb {
    font-size: 14px;
    color: var(--ink-soft);
    max-width: 34em;
    margin: 0 auto 26px;
  }

  .register-button {
    display: inline-block;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--button-text);
    background: var(--button-bg);
    border: none;
    border-radius: 6px;
    padding: 14px 34px;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.15s ease;
  }

  .register-button:hover { background: var(--button-hover); }

  .register-button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .enter-hint {
    margin: 14px 0 0;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
  }

  .enter-hint kbd {
    font-family: var(--sans);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 6px;
    background: var(--card);
  }

  /* ---------- Floral decorations ---------- */

  .flourish { position: absolute; pointer-events: none; color: var(--leaf); }
  .flourish svg { display: block; width: 100%; height: 100%; }

  .flourish.fl-bottom-left { left: -18px; bottom: -14px; width: 130px; height: 130px; transform: rotate(-12deg); }
  .flourish.fl-bottom-right { right: -20px; bottom: -18px; width: 150px; height: 150px; transform: rotate(160deg); }
  .flourish.fl-top-right { right: 26px; top: 18px; width: 74px; height: 74px; transform: rotate(38deg); }

  @media (max-width: 719px) {
    .flourish.fl-top-right { display: none; }
  }
</style>
</head>
<body>

  <!-- Text block -->
  <div class="landing-text">

    <p class="landing-date" id="landing-date">12 . 12 . 2026</p>
    <p class="landing-blurb" id="landing-blurb">
      With the blessing of our families, we invite you to celebrate our wedding at
      Dewan Seri Melati, Shah Alam. Come for the kompang, stay for the nasi minyak.
    </p>
    <a href="index.html" class="register-button" id="register-button">Register Now</a>
    <p class="enter-hint">or press <kbd>Enter</kbd> to open the invitation</p>

</div>

<script src="wedding-data.js"></script>
<script>
(function () {
  'use strict';

  // ------------------------------------------------------------------
  // Landing content follows whatever the couple set in the admin page.
  // ------------------------------------------------------------------

  var weddingData = KenduriData.loadWeddingData();

  document.title = 'Kenduri RSVP — ' + weddingData.coupleShort;
  document.getElementById('landing-names').textContent = weddingData.coupleShort;

  // "Saturday, 12 December 2026" -> "12 . 12 . 2026" for the landing display.
  var monthNames = [
    'january', 'february', 'march', 'april', 'may', 'june',
    'july', 'august', 'september', 'october', 'november', 'december'
  ];
  var dateMatch = weddingData.weddingDate.match(/(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/);
  if (dateMatch) {
    var monthNumber = monthNames.indexOf(dateMatch[2].toLowerCase()) + 1;
    if (monthNumber > 0) {
      document.getElementById('landing-date').textContent =
        dateMatch[1] + ' . ' + monthNumber + ' . ' + dateMatch[3];
    } else {
      document.getElementById('landing-date').textContent = weddingData.weddingDate;
    }
  } else {
    document.getElementById('landing-date').textContent = weddingData.weddingDate;
  }

  var venueFirstLine = weddingData.venue.split('\n')[0].trim();
  document.getElementById('landing-blurb').textContent =
    weddingData.tagline + ' ' + venueFirstLine + '.';

  // ------------------------------------------------------------------
  // Enter opens the guest view, like the Register button. Both mark the
  // arrival in sessionStorage so the guest page accepts them; a plain
  // refresh of the guest page has no mark and returns to the landing.
  // ------------------------------------------------------------------

  var ARRIVAL_FLAG = 'kenduri-arrived-internally';

  function markArrivalAndOpenGuestPage() {
    try {
      window.sessionStorage.setItem(ARRIVAL_FLAG, 'yes');
    } catch (flagError) {
      // Storage unavailable — the guest page then skips its redirect too.
    }
    window.location.href = 'index.html';
  }

  document.getElementById('register-button').addEventListener('click', markArrivalAndOpenGuestPage);

  document.addEventListener('keydown', function (keyPressEvent) {
    if (keyPressEvent.key === 'Enter') {
      markArrivalAndOpenGuestPage();
    }
  });
})();
</script>
</body>
</html>
